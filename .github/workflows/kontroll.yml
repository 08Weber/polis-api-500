name: Kontroll

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Varje måndag: larmar via mejl om Polisens API har ändrats.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions är låsta till en commit (inte en tagg som kan flyttas). Dependabot föreslår uppdateringar.
jobs:
  tester:
    name: Enhetstester
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm test

  api:
    name: Polisens API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Hela Sverige
        run: node scripts/check-api.mjs --sample 3
      # Polisens regler: minst 10 sekunder mellan anropen.
      - name: Paus
        run: sleep 15
      - name: Östergötland
        run: node scripts/check-api.mjs --lan "Östergötlands län" --sample 3
