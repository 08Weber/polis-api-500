name: Kontroll

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Varje måndag: larmar via mejl om Polisens API har ändrats.
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  tester:
    name: Enhetstester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  api:
    name: Polisens API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-api.mjs --sample 3
